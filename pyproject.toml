[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotenv-check"
version = "0.1.1"
description = "Compare .env with .env.example: missing, empty, placeholder and extra keys. Never prints values."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
dotenv-check = "dotenv_check.cli:main"
